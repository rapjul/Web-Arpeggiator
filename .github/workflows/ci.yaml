name: CI Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test with Coverage, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting (Biome)
        run: bun run format:check

      - name: Run test suite with V8 coverage gates
        id: test_coverage
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          bun run test:coverage | tee coverage_output.txt

      - name: Publish Test Coverage to Job Summary and PR Comment
        if: always() && steps.test_coverage.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let markdownReport = '';
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = summary.total;
              
              const formatPct = (pct, target) => {
                const icon = pct >= target ? '🟢 **Pass**' : '🔴 **Fail**';
                return { pct: `**${pct.toFixed(2)}%**`, icon };
              };
              
              const stmts = formatPct(total.statements.pct, 80);
              const branch = formatPct(total.branches.pct, 70);
              const funcs = formatPct(total.functions.pct, 80);
              const lines = formatPct(total.lines.pct, 80);
              
              markdownReport = `### 📊 Automated Test Coverage Report\n\n` +
                `| Metric | Target | Covered / Total | Coverage | Status |\n` +
                `| :--- | :---: | :---: | :---: | :---: |\n` +
                `| **Statements** | $\\ge 80\\%$ | ${total.statements.covered.toLocaleString()} / ${total.statements.total.toLocaleString()} | ${stmts.pct} | ${stmts.icon} |\n` +
                `| **Branches** | $\\ge 70\\%$ | ${total.branches.covered.toLocaleString()} / ${total.branches.total.toLocaleString()} | ${branch.pct} | ${branch.icon} |\n` +
                `| **Functions** | $\\ge 80\\%$ | ${total.functions.covered.toLocaleString()} / ${total.functions.total.toLocaleString()} | ${funcs.pct} | ${funcs.icon} |\n` +
                `| **Lines** | $\\ge 80\\%$ | ${total.lines.covered.toLocaleString()} / ${total.lines.total.toLocaleString()} | ${lines.pct} | ${lines.icon} |\n\n` +
                `<details>\n<summary>📁 <b>File-by-File Coverage Details (Click to Expand)</b></summary>\n\n` +
                `| File | Statements | Branches | Functions | Lines |\n` +
                `| :--- | :---: | :---: | :---: | :---: |\n`;
                
              const files = Object.keys(summary).filter(k => k !== 'total').sort();
              for (const file of files) {
                const relPath = file.includes('src/') ? file.substring(file.indexOf('src/')) : path.basename(file);
                const data = summary[file];
                markdownReport += `| \`${relPath}\` | ${data.statements.pct.toFixed(1)}% | ${data.branches.pct.toFixed(1)}% | ${data.functions.pct.toFixed(1)}% | ${data.lines.pct.toFixed(1)}% |\n`;
              }
              
              markdownReport += `\n</details>\n\n*Generated by CI Quality Gate for commit \`${context.sha.substring(0, 7)}\`.*`;
            } else if (fs.existsSync('coverage_output.txt')) {
              let output = fs.readFileSync('coverage_output.txt', 'utf8');
              output = output.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
              markdownReport = `### 📊 Automated Test Coverage Report\n\n\`\`\`\n${output}\n\`\`\`\n\n*Generated by CI Quality Gate for commit \`${context.sha.substring(0, 7)}\`.*`;
            }
            
            // 1. Write to GitHub Step Summary
            if (process.env.GITHUB_STEP_SUMMARY && markdownReport) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdownReport + '\n');
            }
            
            // 2. Post or update sticky comment on pull request
            if (context.eventName === 'pull_request' && markdownReport) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('### 📊 Automated Test Coverage Report'));
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: markdownReport,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: markdownReport,
                });
              }
            }

      - name: Build production bundle
        run: bun run build
