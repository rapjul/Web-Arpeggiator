name: CI Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test with Coverage, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting (Biome)
        run: bun run format:check

      - name: Check code quality and lints (Biome)
        run: bun run lint

      - name: Run test suite with V8 coverage gates
        run: bun run test:coverage

      - name: Build production bundle
        run: bun run build

      - name: Archive coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-artifacts
          path: coverage/
          retention-days: 7

  publish-coverage-report:
    name: Publish Coverage Report
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-artifacts
          path: coverage

      - name: Publish Test Coverage to Step Summary and PR Comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            if (!fs.existsSync('coverage/coverage-summary.json')) return;
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            
            const formatPct = (pct, target) => ({
              pct: `**${pct.toFixed(2)}%**`,
              icon: pct >= target ? '🟢 **Pass**' : '🔴 **Fail**',
            });
            
            const stmts = formatPct(total.statements.pct, 80);
            const branch = formatPct(total.branches.pct, 70);
            const funcs = formatPct(total.functions.pct, 80);
            const lines = formatPct(total.lines.pct, 80);

            const files = Object.keys(summary).filter(k => k !== 'total').sort();
            let fileRows = '';
            for (const file of files) {
              const relPath = file.includes('src/') ? file.substring(file.indexOf('src/')) : path.basename(file);
              const data = summary[file];
              const pass = data.statements.pct >= 80 && data.branches.pct >= 70 && data.functions.pct >= 80 && data.lines.pct >= 80;
              fileRows += `| \`${relPath}\` | ${data.statements.pct.toFixed(1)}% | ${data.branches.pct.toFixed(1)}% | ${data.functions.pct.toFixed(1)}% | ${data.lines.pct.toFixed(1)}% | ${pass ? '🟢 Pass' : '🔴 Fail'} |\n`;
            }

            const markdown = `### 📊 Automated Test Coverage Report\n\n` +
              `| Metric | Target | Covered / Total | Coverage | Status |\n` +
              `| :--- | :---: | :---: | :---: | :---: |\n` +
              `| **Statements** | $\\ge 80\\%$ | ${total.statements.covered.toLocaleString()} / ${total.statements.total.toLocaleString()} | ${stmts.pct} | ${stmts.icon} |\n` +
              `| **Branches** | $\\ge 70\\%$ | ${total.branches.covered.toLocaleString()} / ${total.branches.total.toLocaleString()} | ${branch.pct} | ${branch.icon} |\n` +
              `| **Functions** | $\\ge 80\\%$ | ${total.functions.covered.toLocaleString()} / ${total.functions.total.toLocaleString()} | ${funcs.pct} | ${funcs.icon} |\n` +
              `| **Lines** | $\\ge 80\\%$ | ${total.lines.covered.toLocaleString()} / ${total.lines.total.toLocaleString()} | ${lines.pct} | ${lines.icon} |\n\n` +
              `<details>\n<summary>📁 <b>File-by-File Coverage Details (Click to Expand)</b></summary>\n\n` +
              `| File | Statements | Branches | Functions | Lines | Status |\n` +
              `| :--- | :---: | :---: | :---: | :---: |\n` +
              fileRows +
              `\n</details>\n\n*Generated by CI Quality Gate for commit \`${context.sha.substring(0, 7)}\`.*`;

            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown + '\n');
            }

            if (context.eventName === 'pull_request') {
              try {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                });
                const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('### 📊 Automated Test Coverage Report'));
                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: markdown,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: markdown,
                  });
                }
              } catch (err) {
                console.warn('Could not post or update PR comment (e.g. fork PR permissions):', err.message);
              }
            }
