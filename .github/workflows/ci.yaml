name: CI Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test with Coverage, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting (Biome)
        run: bun run format:check

      - name: Run test suite with V8 coverage gates
        id: test_coverage
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          bun run test:coverage | tee coverage_output.txt

      - name: Publish Test Coverage to Job Summary
        if: always() && steps.test_coverage.outcome != 'skipped'
        run: |
          echo "### 📊 Vitest V8 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 35 "% Coverage report from v8" coverage_output.txt >> $GITHUB_STEP_SUMMARY || cat coverage_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Test Coverage Summary
        if: github.event_name == 'pull_request' && always() && steps.test_coverage.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage_output.txt')) return;
            let output = fs.readFileSync('coverage_output.txt', 'utf8');
            output = output.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
            const summaryMatch = output.match(/% Coverage report from v8[\s\S]*?================================================================================/);
            const content = summaryMatch ? summaryMatch[0] : output;
            
            const commentBody = `### 📊 Automated Test Coverage Report\n\n\`\`\`\n${content}\n\`\`\`\n\n*Generated by CI Quality Gate for commit \`${context.sha.substring(0, 7)}\`.*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('### 📊 Automated Test Coverage Report'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Build production bundle
        run: bun run build
